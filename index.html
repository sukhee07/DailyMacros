<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Daily Macros (Recomp Plan)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      /* Dark Theme (Default) */
      --bg: #0b0f14;
      --bg-elevated: #121820;
      --surface: #171f29;
      --surface-2: #1d2733;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f7fb;
      --muted: #93a0b0;
      --accent: #5eead4;
      --accent-dim: rgba(94, 234, 212, 0.14);
      --protein: #7dd3fc;
      --carbs: #fbbf24;
      --fats: #f472b6;
      --fiber: #a3e635;
      --danger: #fb7185;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --touch: 48px;
      --header-bg: linear-gradient(180deg, rgba(11, 15, 20, 0.96) 0%, rgba(11, 15, 20, 0.92) 100%);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-elevated: #ffffff;
      --surface: #f1f5f9;
      --surface-2: #e2e8f0;
      --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0d9488;
      --accent-dim: rgba(13, 148, 136, 0.14);
      --protein: #0284c7;
      --carbs: #d97706;
      --fats: #db2777;
      --fiber: #65a30d;
      --danger: #e11d48;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      --header-bg: linear-gradient(180deg, rgba(248, 250, 252, 0.96) 0%, rgba(248, 250, 252, 0.92) 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body {
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
    }

    .dashboard {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      box-shadow: var(--shadow);
    }

    .dash-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn.danger {
      color: var(--danger);
      background: rgba(251, 113, 133, 0.1);
      border-color: rgba(251, 113, 133, 0.35);
    }

    .totals {
      display: grid;
      grid-template-columns: 1.15fr 1fr 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat .label {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .stat .value {
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .stat.cal { color: var(--accent); }
    .stat.pro { color: var(--protein); }
    .stat.carb { color: var(--carbs); }
    .stat.fat { color: var(--fats); }
    .stat.fib { color: var(--fiber); }

    /* Progress Bars */
    .stat-bar-bg {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
      width: 100%;
    }

    [data-theme="light"] .stat-bar-bg {
      background: rgba(0, 0, 0, 0.1);
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .stat.cal .stat-bar-fill { background: var(--accent); }
    .stat.pro .stat-bar-fill { background: var(--protein); }
    .stat.carb .stat-bar-fill { background: var(--carbs); }
    .stat.fat .stat-bar-fill { background: var(--fats); }
    .stat.fib .stat-bar-fill { background: var(--fiber); }

    .chart-container {
      position: relative;
      height: 100px;
      width: 100%;
      margin: 16px 0 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .target-msg {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 6px;
      align-items: center;
    }

    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      min-height: var(--touch);
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0 16px 0 44px;
      font-size: 1rem;
      outline: none;
    }

    .search-wrap input:focus {
      border-color: rgba(94, 234, 212, 0.45);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .create-food-btn {
      width: 100%;
      padding: 14px;
      background: var(--surface-2);
      border: 1px dashed var(--muted);
      border-radius: 16px;
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s;
    }
    .create-food-btn:active {
      transform: scale(0.98);
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent-dim);
      border-color: rgba(94, 234, 212, 0.4);
      color: var(--accent);
    }

    .log-card,
    .foods {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .section-title {
      padding: 14px 16px 8px;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .save-meal-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .log-empty {
      padding: 0 16px 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.92rem;
    }

    .log-item-info {
      display: flex;
      flex-direction: column;
    }

    .log-item-info span {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
      margin-top: 2px;
    }

    .log-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-qty {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      text-align: center;
    }

    /* Inline Adjustments */
    .log-adj-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      font-size: 1rem;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .log-adj-btn:active {
      transform: scale(0.9);
    }

    .remove-btn {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(251, 113, 133, 0.35);
      background: rgba(251, 113, 133, 0.1);
      color: var(--danger);
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
      margin-left: 4px;
    }

    .remove-btn:active {
      transform: scale(0.9);
    }

    .food-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 12px 12px 16px;
      border-top: 1px solid var(--border);
    }

    .food-name {
      font-weight: 650;
      font-size: 0.98rem;
    }

    .food-serving {
      color: var(--muted);
      font-size: 0.78rem;
      margin: 2px 0 6px;
    }

    .macros {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .macros b {
      font-weight: 700;
      color: var(--text);
    }

    .add-actions {
      display: flex;
      gap: 6px;
    }

    .add-btn {
      width: var(--touch);
      height: var(--touch);
      border: 0;
      border-radius: 12px;
      color: #04221c;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.1s;
    }

    .add-btn.half {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 1rem;
    }

    .add-btn.full {
      background: var(--accent);
    }

    [data-theme="light"] .add-btn.full {
      color: #ffffff;
    }

    .add-btn:active {
      transform: scale(0.94);
    }

    .add-btn.flash {
      background: #34d399 !important;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    
    .modal {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 90%;
      max-width: 400px;
      padding: 20px;
      transform: translateY(20px) scale(0.95);
      transition: all 0.2s;
      box-shadow: var(--shadow);
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-overlay.active .modal {
      transform: translateY(0) scale(1);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .modal-header h3 { font-size: 1.1rem; }
    
    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .custom-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    
    .custom-form input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
      min-width: 0;
    }
    
    .custom-form input:focus {
      border-color: var(--accent);
    }
    
    .custom-macros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    
    .save-custom-btn {
      background: var(--accent);
      color: #04221c;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    [data-theme="light"] .save-custom-btn { color: #fff; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 14px;
      opacity: 0;
      pointer-events: none;
      transition: 0.22s ease;
      z-index: 40;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 420px) {
      .totals {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .stat {
        padding: 8px 4px;
      }

      .stat .value {
        font-size: 0.92rem;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="dashboard">
      <div class="dash-top">
        <div class="brand">
          <h1>Daily Macros</h1>
          <span id="today-label"></span>
        </div>
        <div class="actions">
          <button class="icon-btn" id="theme-btn" aria-label="Toggle light/dark theme">
            <!-- Moon Icon by default -->
            <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button class="icon-btn" id="settings-btn" aria-label="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button class="icon-btn" id="history-btn" aria-label="History">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </button>
          <button class="icon-btn danger" id="reset-btn" aria-label="Reset Day">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Totals & Progress -->
      <div class="totals">
        <div class="stat cal">
          <span class="label">Cal</span><span class="value" id="tot-cal">0</span>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" id="bar-cal"></div>
          </div>
        </div>
        <div class="stat pro">
          <span class="label">Protein</span><span class="value" id="tot-pro">0g</span>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" id="bar-pro"></div>
          </div>
        </div>
        <div class="stat carb">
          <span class="label">Carbs</span><span class="value" id="tot-carb">0g</span>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" id="bar-carb"></div>
          </div>
        </div>
        <div class="stat fat">
          <span class="label">Fats</span><span class="value" id="tot-fat">0g</span>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" id="bar-fat"></div>
          </div>
        </div>
        <div class="stat fib">
          <span class="label">Fiber</span><span class="value" id="tot-fib">0g</span>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" id="bar-fib"></div>
          </div>
        </div>
      </div>
      
      <!-- Chart.js Canvas -->
      <div class="chart-container">
        <canvas id="macroChart"></canvas>
      </div>
      <div class="target-msg" id="target-msg"></div>
      
    </header>

    <main class="content">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
          <path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input id="search" type="search" placeholder="Search foods or meals…" autocomplete="off" />
      </div>
      
      <button class="create-food-btn" id="open-modal-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        Create Custom Food
      </button>

      <div class="chips" id="chips"></div>

      <section class="log-card" aria-label="Today's log">
        <div class="section-title">
          <span>Today's Foods</span>
          <button class="save-meal-btn" id="save-meal-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Save as Meal
          </button>
        </div>
        <div id="log"></div>
      </section>

      <section class="foods" aria-label="Food list">
        <div class="section-title">Add food</div>
        <div id="food-list"></div>
      </section>
    </main>
  </div>
  
  <!-- Custom Food Modal -->
  <div class="modal-overlay" id="custom-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Custom Food</h3>
        <button class="close-btn" id="close-modal">&times;</button>
      </div>
      <form class="custom-form" id="custom-form">
        <input type="text" id="custom-name" placeholder="Food Name (e.g. Pizza)" required />
        <input type="text" id="custom-serving" placeholder="Serving Size (e.g. 1 slice)" required />
        <div class="custom-macros">
          <input type="number" id="custom-cal" placeholder="Calories" required min="0" step="1"/>
          <input type="number" id="custom-pro" placeholder="Protein (g)" required min="0" step="0.1"/>
          <input type="number" id="custom-carb" placeholder="Carbs (g)" required min="0" step="0.1"/>
          <input type="number" id="custom-fat" placeholder="Fats (g)" required min="0" step="0.1"/>
        </div>
        <input type="number" id="custom-fib" placeholder="Fiber (g) - Optional" min="0" step="0.1"/>
        <button type="submit" class="save-custom-btn">Save to My Foods</button>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Macro Goals</h3>
        <button class="close-btn" id="close-settings">&times;</button>
      </div>
      <form class="custom-form" id="settings-form">
        <input type="number" id="set-cal" placeholder="Calorie Goal" required min="1" step="1"/>
        <div class="custom-macros">
          <input type="number" id="set-pro" placeholder="Protein Goal (g)" required min="1" step="1"/>
          <input type="number" id="set-carb" placeholder="Carb Goal (g)" required min="1" step="1"/>
          <input type="number" id="set-fat" placeholder="Fat Goal (g)" required min="1" step="1"/>
          <input type="number" id="set-fib" placeholder="Fiber Goal (g)" required min="1" step="1"/>
        </div>
        <button type="submit" class="save-custom-btn">Save Targets</button>
      </form>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Calendar History</h3>
        <button class="close-btn" id="close-history">&times;</button>
      </div>
      <div id="history-list" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_KEY = "daily-macros-recomp-v3";
    const TARGETS_KEY = "daily-macros-targets";
    const HISTORY_KEY = "daily-macros-history";

    // Macro Goals (Default Recomp)
    let TARGETS = { cal: 2000, pro: 150, carb: 175, fat: 65, fib: 25 };
    try {
      const storedTargets = localStorage.getItem(TARGETS_KEY);
      if (storedTargets) TARGETS = JSON.parse(storedTargets);
    } catch(e) {}

    const DEFAULT_FOODS = [
      // Pre-Workout / Breakfast
      { id: "apple", name: "Apple", serving: "1 Medium", category: "Pre-Workout", cal: 62, pro: 0, carb: 17, fat: 0, fib: 3 },
      { id: "milk-pre", name: "Whole Fat Milk", serving: "50 ml", category: "Pre-Workout", cal: 31, pro: 2, carb: 2, fat: 2, fib: 0 },
      { id: "black-coffee", name: "Black Coffee", serving: "1 cup", category: "Pre-Workout", cal: 2, pro: 0, carb: 0, fat: 0, fib: 0 },

      // Post-Workout
      { id: "oats", name: "Oats", serving: "50g", category: "Post-Workout", cal: 195, pro: 7, carb: 33, fat: 3, fib: 5 },
      { id: "yeast", name: "Yeast Protein", serving: "1 Scoop (~40g)", category: "Post-Workout", cal: 165, pro: 25, carb: 7, fat: 2, fib: 1 },
      { id: "milk-post", name: "Whole Fat Milk", serving: "100 ml", category: "Post-Workout", cal: 62, pro: 3.3, carb: 4.7, fat: 3.3, fib: 0 },
      { id: "pb", name: "Peanut Butter", serving: "1 Tbsp", category: "Post-Workout", cal: 94, pro: 4, carb: 3, fat: 8, fib: 1 },
      { id: "almond", name: "Almond", serving: "1 nut", category: "Post-Workout", cal: 7, pro: 0.2, carb: 0.2, fat: 0.6, fib: 0.2 },

      // Snacks
      { id: "fruit", name: "Papaya / Melon", serving: "100g", category: "Snacks", cal: 60, pro: 1, carb: 15, fat: 0, fib: 2 },
      { id: "banana", name: "Banana", serving: "1 Medium", category: "Snacks", cal: 105, pro: 1, carb: 27, fat: 0, fib: 3 },

      // Proteins
      { id: "chicken", name: "Raw Chicken Breast", serving: "100g", category: "Proteins", cal: 175, pro: 31, carb: 0, fat: 4.5, fib: 0 },
      { id: "egg", name: "Whole Egg", serving: "1 large", category: "Proteins", cal: 70, pro: 6, carb: 0.5, fat: 5, fib: 0 },
      { id: "egg-white", name: "Egg White", serving: "1 large", category: "Proteins", cal: 17, pro: 3.6, carb: 0.2, fat: 0, fib: 0 },
      { id: "soya", name: "Soya Chunks (dry)", serving: "40g", category: "Proteins", cal: 138, pro: 20.5, carb: 13, fat: 0.5, fib: 5 },
      { id: "paneer", name: "Paneer", serving: "100g", category: "Proteins", cal: 295, pro: 18, carb: 3.3, fat: 22, fib: 0 },
      { id: "tofu", name: "Tofu", serving: "100g", category: "Proteins", cal: 93, pro: 8, carb: 2, fat: 5.3, fib: 0.7 },

      // Carbs & Sides
      { id: "rice", name: "Cooked Rice", serving: "100g", category: "Carbs", cal: 130, pro: 2.7, carb: 28, fat: 0, fib: 1 },
      { id: "dal", name: "Cooked Dal", serving: "1 bowl (~150g)", category: "Carbs", cal: 133, pro: 8, carb: 23.3, fat: 1.3, fib: 5.3 },
      { id: "ghee_chapati", name: "Ghee Chapati", serving: "1 piece", category: "Carbs", cal: 150, pro: 3, carb: 15, fat: 4, fib: 2 },
      { id: "chapati", name: "Chapati", serving: "1 piece", category: "Carbs", cal: 110, pro: 3, carb: 15, fat: 1, fib: 2 },
      { id: "curd", name: "Curd / Yogurt", serving: "100g", category: "Extras", cal: 60, pro: 3, carb: 4, fat: 3, fib: 0 },
      { id: "salad", name: "Salad", serving: "1 bowl", category: "Extras", cal: 15, pro: 0, carb: 3, fat: 0, fib: 2 },
      { id: "oil", name: "Cooking Oil / Ghee", serving: "1 tsp (5ml)", category: "Extras", cal: 45, pro: 0, carb: 0, fat: 5, fib: 0 },
    ];

    let customFoods = [];
    try {
      const stored = localStorage.getItem("daily-macros-custom-foods");
      if (stored) customFoods = JSON.parse(stored);
    } catch(e) {}

    function getAllFoods() {
      return [...customFoods, ...DEFAULT_FOODS];
    }
    
    function getCategories() {
      return ["All", ...Array.from(new Set(getAllFoods().map((f) => f.category)))];
    }

    const emptyTotals = () => ({ cal: 0, pro: 0, carb: 0, fat: 0, fib: 0 });

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function saveToHistory(pastState) {
      if (pastState.totals.cal === 0) return;
      try {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        history = history.filter(h => h.date !== pastState.date);
        history.push(pastState);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch(e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { date: todayKey(), totals: emptyTotals(), log: [] };
        const parsed = JSON.parse(raw);
        if (parsed.date !== todayKey()) {
          saveToHistory(parsed);
          return { date: todayKey(), totals: emptyTotals(), log: [] };
        }

        let logData = [];
        if (Array.isArray(parsed.log)) {
          logData = parsed.log.map(item => {
            if (typeof item === 'string') return { id: item, qty: 1 };
            return item;
          });
        }

        return {
          date: parsed.date,
          totals: { ...emptyTotals(), ...parsed.totals },
          log: logData
        };
      } catch {
        return { date: todayKey(), totals: emptyTotals(), log: [] };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = loadState();
    let category = "All";
    let query = "";
    let toastTimer;

    const foodListEl = document.getElementById("food-list");
    const chipsEl = document.getElementById("chips");
    const logEl = document.getElementById("log");
    const toastEl = document.getElementById("toast");
    const themeBtn = document.getElementById("theme-btn");
    const root = document.documentElement;

    document.getElementById("today-label").textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long",
      month: "short",
      day: "numeric"
    });

    const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
    const sunIcon = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;

    // Chart Setup
    let macroChart;
    const ctx = document.getElementById('macroChart').getContext('2d');
    
    function initChart() {
      // Use CSS variables for chart colors
      const isLight = root.getAttribute('data-theme') === 'light';
      const colors = isLight 
        ? ['#0284c7', '#d97706', '#db2777', '#e2e8f0'] // Light mode
        : ['#7dd3fc', '#fbbf24', '#f472b6', '#1d2733']; // Dark mode

      const pro = Math.max(0, state.totals.pro);
      const carb = Math.max(0, state.totals.carb);
      const fat = Math.max(0, state.totals.fat);
      
      const isEmpty = pro === 0 && carb === 0 && fat === 0;

      macroChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Protein', 'Carbs', 'Fats'],
          datasets: [{
            data: isEmpty ? [0, 0, 0, 1] : [pro, carb, fat],
            backgroundColor: isEmpty ? [colors[3], colors[3], colors[3], colors[3]] : [colors[0], colors[1], colors[2]],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '75%',
          plugins: {
            legend: { display: false },
            tooltip: { enabled: !isEmpty }
          },
          animation: { animateScale: true }
        }
      });
    }

    function updateChart() {
      if (!macroChart) return;
      
      const isLight = root.getAttribute('data-theme') === 'light';
      const colors = isLight 
        ? ['#0284c7', '#d97706', '#db2777', '#e2e8f0']
        : ['#7dd3fc', '#fbbf24', '#f472b6', '#1d2733'];

      const pro = Math.max(0, state.totals.pro);
      const carb = Math.max(0, state.totals.carb);
      const fat = Math.max(0, state.totals.fat);
      
      const isEmpty = pro === 0 && carb === 0 && fat === 0;

      macroChart.data.datasets[0].data = isEmpty ? [0, 0, 0, 1] : [pro, carb, fat];
      macroChart.data.datasets[0].backgroundColor = isEmpty ? [colors[3], colors[3], colors[3], colors[3]] : [colors[0], colors[1], colors[2]];
      macroChart.update();
    }

    function applyTheme(theme) {
      if (theme === 'light') {
        root.setAttribute('data-theme', 'light');
        document.getElementById("theme-icon").innerHTML = moonIcon;
        document.getElementById("theme-color-meta").setAttribute("content", "#f8fafc");
      } else {
        root.removeAttribute('data-theme');
        document.getElementById("theme-icon").innerHTML = sunIcon;
        document.getElementById("theme-color-meta").setAttribute("content", "#0b0f14");
      }
      if(macroChart) updateChart();
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      applyTheme(savedTheme);
    }

    themeBtn.addEventListener('click', () => {
      const isLight = root.getAttribute('data-theme') === 'light';
      const newTheme = isLight ? 'dark' : 'light';
      localStorage.setItem('theme', newTheme);
      applyTheme(newTheme);
    });

    function round(n) {
      return Math.round(n * 10) / 10;
    }

    function renderTotals() {
      // Prevent negative rendering
      const cal = Math.max(0, state.totals.cal);
      const pro = Math.max(0, state.totals.pro);
      const carb = Math.max(0, state.totals.carb);
      const fat = Math.max(0, state.totals.fat);
      const fib = Math.max(0, state.totals.fib);

      document.getElementById("tot-cal").textContent = Math.round(cal);
      document.getElementById("tot-pro").textContent = round(pro) + "g";
      document.getElementById("tot-carb").textContent = round(carb) + "g";
      document.getElementById("tot-fat").textContent = round(fat) + "g";
      document.getElementById("tot-fib").textContent = round(fib) + "g";

      // Update Progress Bars
      document.getElementById("bar-cal").style.width = Math.min(100, (cal / TARGETS.cal) * 100) + "%";
      document.getElementById("bar-pro").style.width = Math.min(100, (pro / TARGETS.pro) * 100) + "%";
      document.getElementById("bar-carb").style.width = Math.min(100, (carb / TARGETS.carb) * 100) + "%";
      document.getElementById("bar-fat").style.width = Math.min(100, (fat / TARGETS.fat) * 100) + "%";
      document.getElementById("bar-fib").style.width = Math.min(100, (fib / TARGETS.fib) * 100) + "%";
      
      document.getElementById("target-msg").textContent = `Goal: ~${TARGETS.cal} kcal | ${TARGETS.pro}g Protein`;
      updateChart();
    }

    function renderLog() {
      if (!state.log.length) {
        logEl.innerHTML = '<p class="log-empty">No foods logged today yet.</p>';
        return;
      }

      const counts = {};
      for (const item of state.log) {
        counts[item.id] = (counts[item.id] || 0) + item.qty;
      }
      
      const allFoods = getAllFoods();
      
      logEl.innerHTML = Object.entries(counts)
        .filter(([id, qty]) => qty > 0)
        .map(([id, qty]) => {
          const food = allFoods.find((f) => f.id === id);
          if (!food) return "";
          return `
            <div class="log-item">
              <div class="log-item-info">
                <strong>${food.name}</strong>
                <span>${round(food.cal * qty)} cal</span>
              </div>
              <div class="log-actions">
                <button class="log-adj-btn" type="button" data-id="${id}" data-qty="-0.5">-</button>
                <span class="log-qty">×${qty}</span>
                <button class="log-adj-btn" type="button" data-id="${id}" data-qty="0.5">+</button>
                <button class="remove-btn" type="button" data-id="${id}" aria-label="Remove ${food.name}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
              </div>
            </div>`;
        })
        .join("");
    }

    function renderChips() {
      const cats = getCategories();
      chipsEl.innerHTML = cats.map(
        (c) => `<button class="chip${c === category ? " active" : ""}" type="button" data-cat="${c}">${c}</button>`
      ).join("");
    }

    function filteredFoods() {
      const q = query.trim().toLowerCase();
      const allFoods = getAllFoods();
      return allFoods.filter((f) => {
        const catOk = category === "All" || f.category === category;
        const qOk = !q || f.name.toLowerCase().includes(q) || f.serving.toLowerCase().includes(q);
        return catOk && qOk;
      });
    }

    function renderFoods() {
      const foods = filteredFoods();
      if (!foods.length) {
        foodListEl.innerHTML = '<p class="log-empty">No matching foods.</p>';
        return;
      }
      foodListEl.innerHTML = foods
        .map(
          (f) => `
          <article class="food-row">
            <div>
              <div class="food-name">${f.name}</div>
              <div class="food-serving">${f.serving}</div>
              <div class="macros">
                <span><b>${f.cal}</b> cal</span>
                <span><b>${f.pro}</b>p</span>
                <span><b>${f.carb}</b>c</span>
                <span><b>${f.fat}</b>f</span>
                <span><b>${f.fib}</b> fiber</span>
              </div>
            </div>
            <div class="add-actions">
              <button class="add-btn half" type="button" data-id="${f.id}" data-qty="0.5">½</button>
              <button class="add-btn full" type="button" data-id="${f.id}" data-qty="1">+</button>
            </div>
          </article>`
        )
        .join("");
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
    }

    function addFood(id, qty, button, quiet = false) {
      const food = getAllFoods().find((f) => f.id === id);
      if (!food) return;

      state.totals.cal += food.cal * qty;
      state.totals.pro += food.pro * qty;
      state.totals.carb += food.carb * qty;
      state.totals.fat += food.fat * qty;
      state.totals.fib += food.fib * qty;

      const existing = state.log.find(item => item.id === id);
      if (existing) {
        existing.qty += qty;
        existing.qty = round(existing.qty * 100) / 100; // Fix float precision

        if (existing.qty <= 0) {
          state.log = state.log.filter(i => i.id !== id);
        }
      } else if (qty > 0) {
        state.log.push({ id, qty });
      }

      saveState();
      renderTotals();
      renderLog();

      if (button) {
        button.classList.add("flash");
        setTimeout(() => button.classList.remove("flash"), 180);
      }
      if (!quiet) showToast(`Added ${qty === 0.5 ? '½ ' : ''}${food.name}`);
    }

    function removeFood(id) {
      const food = getAllFoods().find((f) => f.id === id);
      if (!food) return;

      const index = state.log.findIndex(item => item.id === id);
      if (index > -1) {
        const item = state.log[index];
        state.totals.cal -= food.cal * item.qty;
        state.totals.pro -= food.pro * item.qty;
        state.totals.carb -= food.carb * item.qty;
        state.totals.fat -= food.fat * item.qty;
        state.totals.fib -= food.fib * item.qty;

        state.log.splice(index, 1);
        saveState();
        renderTotals();
        renderLog();
        showToast(`Removed ${food.name}`);
      }
    }

    // Modal Events
    const customModal = document.getElementById("custom-modal");
    document.getElementById("open-modal-btn").addEventListener("click", () => {
      customModal.classList.add("active");
    });
    document.getElementById("close-modal").addEventListener("click", () => {
      customModal.classList.remove("active");
    });

    const settingsModal = document.getElementById("settings-modal");
    document.getElementById("settings-btn").addEventListener("click", () => {
      document.getElementById("set-cal").value = TARGETS.cal;
      document.getElementById("set-pro").value = TARGETS.pro;
      document.getElementById("set-carb").value = TARGETS.carb;
      document.getElementById("set-fat").value = TARGETS.fat;
      document.getElementById("set-fib").value = TARGETS.fib;
      settingsModal.classList.add("active");
    });
    document.getElementById("close-settings").addEventListener("click", () => {
      settingsModal.classList.remove("active");
    });

    // History Modal Logic
    const historyModal = document.getElementById("history-modal");
    document.getElementById("history-btn").addEventListener("click", () => {
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
      } catch(e) {}
      
      const listEl = document.getElementById("history-list");
      if (history.length === 0) {
        listEl.innerHTML = '<p class="log-empty" style="padding:0">No history yet. (Days will save automatically when the date changes).</p>';
      } else {
        history.sort((a,b) => b.date.localeCompare(a.date));
        listEl.innerHTML = history.map(h => `
          <div style="background:var(--surface);padding:12px;border-radius:12px;border:1px solid var(--border);">
            <div style="font-weight:600;margin-bottom:6px;">${new Date(h.date).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'})}</div>
            <div style="font-size:0.85rem;color:var(--muted);display:flex;justify-content:space-between;">
              <span>Cal: <b>${Math.round(h.totals.cal)}</b></span>
              <span>Pro: <b>${round(h.totals.pro)}g</b></span>
              <span>Carb: <b>${round(h.totals.carb)}g</b></span>
              <span>Fat: <b>${round(h.totals.fat)}g</b></span>
            </div>
          </div>
        `).join("");
      }
      historyModal.classList.add("active");
    });
    document.getElementById("close-history").addEventListener("click", () => {
      historyModal.classList.remove("active");
    });

    // Save Meal Logic
    document.getElementById("save-meal-btn").addEventListener("click", () => {
      if(state.log.length === 0) {
        return showToast("Log some foods first to save as a meal!");
      }
      
      const mealName = prompt("Name your meal (e.g. My Breakfast):");
      if(!mealName) return;

      const mealFood = {
        id: "meal_" + Date.now(),
        name: mealName,
        serving: "1 Meal",
        category: "Meals",
        cal: round(state.totals.cal),
        pro: round(state.totals.pro),
        carb: round(state.totals.carb),
        fat: round(state.totals.fat),
        fib: round(state.totals.fib),
      };

      customFoods.push(mealFood);
      localStorage.setItem("daily-macros-custom-foods", JSON.stringify(customFoods));
      
      category = "Meals";
      renderChips();
      renderFoods();
      showToast(`Saved meal: ${mealName}`);
    });

    // Handle Custom Food Submit
    document.getElementById("custom-form").addEventListener("submit", (e) => {
      e.preventDefault();
      
      const newFood = {
        id: "custom_" + Date.now(),
        name: document.getElementById("custom-name").value.trim(),
        serving: document.getElementById("custom-serving").value.trim(),
        category: "Custom",
        cal: parseFloat(document.getElementById("custom-cal").value) || 0,
        pro: parseFloat(document.getElementById("custom-pro").value) || 0,
        carb: parseFloat(document.getElementById("custom-carb").value) || 0,
        fat: parseFloat(document.getElementById("custom-fat").value) || 0,
        fib: parseFloat(document.getElementById("custom-fib").value) || 0,
      };
      
      customFoods.push(newFood);
      localStorage.setItem("daily-macros-custom-foods", JSON.stringify(customFoods));
      
      customModal.classList.remove("active");
      e.target.reset();
      
      category = "Custom";
      renderChips();
      renderFoods();
      showToast("Custom food saved!");
    });

    // Handle Settings Submit
    document.getElementById("settings-form").addEventListener("submit", (e) => {
      e.preventDefault();
      TARGETS = {
        cal: parseInt(document.getElementById("set-cal").value) || 2000,
        pro: parseInt(document.getElementById("set-pro").value) || 150,
        carb: parseInt(document.getElementById("set-carb").value) || 175,
        fat: parseInt(document.getElementById("set-fat").value) || 65,
        fib: parseInt(document.getElementById("set-fib").value) || 25,
      };
      localStorage.setItem(TARGETS_KEY, JSON.stringify(TARGETS));
      settingsModal.classList.remove("active");
      renderTotals();
      showToast("Macro targets saved!");
    });

    // Handle Log interactions (+ / - / Remove)
    logEl.addEventListener("click", (e) => {
      const rmBtn = e.target.closest(".remove-btn");
      if (rmBtn) {
        return removeFood(rmBtn.dataset.id);
      }

      const adjBtn = e.target.closest(".log-adj-btn");
      if (adjBtn) {
        const qty = parseFloat(adjBtn.dataset.qty);
        addFood(adjBtn.dataset.id, qty, null, true);
      }
    });

    // Handle Food List additions
    foodListEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".add-btn");
      if (!btn) return;
      const qty = parseFloat(btn.dataset.qty) || 1;
      addFood(btn.dataset.id, qty, btn);
    });

    chipsEl.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      category = chip.dataset.cat;
      renderChips();
      renderFoods();
    });

    document.getElementById("search").addEventListener("input", (e) => {
      query = e.target.value;
      renderFoods();
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      if (!confirm("Reset today's totals?")) return;
      state = { date: todayKey(), totals: emptyTotals(), log: [] };
      saveState();
      renderTotals();
      renderLog();
      showToast("Day reset");
    });

    initChart();
    renderChips();
    renderTotals();
    renderLog();
    renderFoods();
  </script>
</body>

</html>
